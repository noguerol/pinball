name: Publish to npm

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for npm Trusted Publishing (no tokens needed)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Read package name & version
        id: pkg
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Debug OIDC claims (temp)
        run: |
          curl -s -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sigstore" -o /tmp/oidc.json
          python3 -c "
import json, base64
claims = json.loads(base64.urlsafe_b64decode(json.load(open('/tmp/oidc.json'))['value'].split('.')[1] + '=='))
for k in ['aud','repository','repository_owner','workflow_ref','job_workflow_ref','ref','ref_type','environment','actor','sha']:
    print(f'{k}: {claims.get(k)}')
"
      - name: Check if version is already published
        id: check
        run: |
          if npm view "${{ steps.pkg.outputs.name }}"@"${{ steps.pkg.outputs.version }}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm (Trusted Publishing / OIDC)
        if: steps.check.outputs.exists == 'false'
        run: npm publish
